<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The page a shared word opens — /w/<code> — for anybody, signed in or not.

      A separate entry from index.html on purpose: it loads the stones and the
      word list and nothing of the garden. No Firebase, no world, no worker.
      See src/word/main.tsx.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0e0d0b" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Somebody left you a five-letter word. Six guesses to find it." />
    <meta property="og:title" content="A word for you" />
    <meta property="og:description" content="Somebody left you a five-letter word. Six guesses to find it." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>A word for you</title>
  </head>
  <body>
    <canvas class="cave" aria-hidden="true"></canvas>
    <div class="cave-shade" aria-hidden="true"></div>
    <div id="word"></div>
    <script type="module" src="/src/word/main.tsx"></script>
  </body>
</html>
